name: 'Chromatic'

# Build StoryBook and publish to Chromatic.
#
# Requires some secrets and/or vars!
# See https://github.com/verkstedt/actions#chromatic
#
# This file has been created from
# https://github.com/verkstedt/.github/blob/main/workflow-templates/chromatic.yaml
#
# IF YOU MODIFY IT IN ANY WAY, DESCRIBE IT IN THE COMMENT HERE
# to make updating in the future easier.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      only-changed:
        description: 'Screenshot only changed stories, not all of them (TurboSnap)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: 'Chromatic'
    uses: verkstedt/actions/.github/workflows/chromatic.yaml@v1
    secrets: inherit
    with:
      working-directory: .
      only-changed: ${{ github.event_name != 'workflow_dispatch' || inputs.only-changed }}

  notify-main-branch-failure:
    name: Notify about failure on main branch
    needs:
      - chromatic
    if: ${{ github.event_name != 'workflow_dispatch' && !cancelled() && !contains(needs.*.result, 'cancelled') && ( github.head_ref || github.ref_name ) == 'main' }}
    uses: verkstedt/actions/.github/workflows/notify-main-branch-failure.yaml@v1
    with:
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
    permissions:
      actions: read
    secrets: inherit
