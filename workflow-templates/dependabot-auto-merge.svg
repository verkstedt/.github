<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Dependabot auto-merge</title>

  <!-- Background -->
  <rect width="256" height="256" fill="#0969da"/>

  <!-- Robot: antenna -->
  <line x1="112" y1="44" x2="112" y2="66" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <circle cx="112" cy="40" r="10" fill="#ffffff"/>

  <!-- Robot: head -->
  <rect x="40" y="66" width="144" height="112" rx="30" fill="#ffffff"/>

  <!-- Robot: ears -->
  <rect x="26" y="102" width="18" height="40" rx="8" fill="#ffffff"/>
  <rect x="180" y="102" width="18" height="40" rx="8" fill="#ffffff"/>

  <!-- Robot: visor and eyes -->
  <rect x="58" y="92" width="108" height="56" rx="24" fill="#0a3069"/>
  <circle cx="88" cy="120" r="11" fill="#54aeff"/>
  <circle cx="136" cy="120" r="11" fill="#54aeff"/>

  <!-- Merge badge -->
  <circle cx="186" cy="186" r="54" fill="#8250df" stroke="#0969da" stroke-width="10"/>
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main line -->
    <line x1="166" y1="160" x2="166" y2="212"/>
    <!-- Branch merging into it -->
    <path d="M166 162 C166 184 182 192 204 192"/>
  </g>
  <g fill="#ffffff">
    <circle cx="166" cy="158" r="11"/>
    <circle cx="166" cy="214" r="11"/>
    <circle cx="208" cy="192" r="11"/>
  </g>
</svg>
